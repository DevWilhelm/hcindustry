# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub/GitLab, then "New +" > "Blueprint" in Render.
services:
  - type: web
    name: healthcare-industry
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
