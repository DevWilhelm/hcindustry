# Render Blueprint — https://render.com/docs/blueprint-spec
# Static site: `npm run build` prerenders every route into dist/client/.
# Deploy: push to GitHub, then "New +" > "Blueprint" in Render.
# Render serves /about from about.html automatically and uses 404.html for misses.
services:
  - type: web
    name: healthcare-industry
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist/client
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
