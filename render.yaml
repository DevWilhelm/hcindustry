# Render Blueprint — https://render.com/docs/blueprint-spec
# Node web service: serves the prerendered pages and the /api/contact route.
# Deploy: push to GitHub, then "New +" > "Blueprint" in Render.
# RESEND_API_KEY is entered in the Render dashboard (sync: false), never committed.
services:
  - type: web
    name: healthcare-industry
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_NOTIFICATION_TO
        value: websiteinquiries@sagasiaconsulting.com
      - key: CONTACT_NOTIFICATION_FROM
        value: websiteinquiries@sagasiaconsulting.com
